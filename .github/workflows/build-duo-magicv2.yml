name: Build Duo Open Magic V2

on:
  push:
    branches:
      - duo-open-magicv2-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone Duo Open
        run: git clone --depth 1 https://github.com/marcoazeem/duo-open.git duo-open
      - name: Patch for HONOR Magic V2 v3
        shell: python
        run: |
          from pathlib import Path

          shader = Path('duo-open/app/src/main/java/com/duoopen/fold/DuoShader.kt')
          s = shader.read_text()
          s = s.replace('const val PANEL_ON_HINGE = 20f', 'const val PANEL_ON_HINGE = 43f')
          shader.write_text(s)

          service = Path('duo-open/app/src/main/java/com/duoopen/overlay/FoldOverlayService.kt')
          s = service.read_text()

          s = s.replace(
              'private var timedResolve = false',
              'private var timedResolve = false\n    private var handoffSnapshot: Bitmap? = null'
          )

          s = s.replace(
              'if (inner != innerPanel) {\n            innerPanel = inner\n            panelSwitched = true\n            if (phase != Phase.IDLE) removeOverlay() // old panel\'s snapshot is meaningless now\n        }',
              '''if (inner != innerPanel) {
            innerPanel = inner
            panelSwitched = true
            if (phase != Phase.IDLE) removeOverlay()
            val cached = handoffSnapshot
            if (cached != null && !cached.isRecycled) {
                val copy = cached.copy(Bitmap.Config.ARGB_8888, false)
                if (copy != null) {
                    val peak = DuoShader.MAX_TILT * DuoSettings.config.value.intensity.coerceAtMost(1f)
                    show(copy, peak, fadeIn = false, timed = !innerPanel)
                    if (innerPanel) follower?.setTarget(currentTilt())
                    panelSwitched = false
                    restArmed = false
                    return
                }
            }
        }'''
          )

          s = s.replace(
              'val tilt = startTilt ?: currentTilt()',
              'val tilt = if (afterSwap) DuoShader.MAX_TILT * DuoSettings.config.value.intensity.coerceAtMost(1f) else (startTilt ?: currentTilt())'
          )

          s = s.replace(
              '// Closing onto the cover: the hinge HAL goes quiet around 30°, so the',
              '''handoffSnapshot?.recycle()
        handoffSnapshot = runCatching { bitmap.copy(Bitmap.Config.ARGB_8888, false) }.getOrNull()

        // Closing onto the cover: the hinge HAL goes quiet around 30°, so the'''
          )

          s = s.replace(
              'show(bitmap, tilt, fadeIn = afterSwap, timed = timed)',
              'show(bitmap, tilt, fadeIn = false, timed = timed)'
          )

          s = s.replace(
              'private const val TIMED_RESOLVE_TAU_S = 0.07f',
              'private const val TIMED_RESOLVE_TAU_S = 0.14f'
          )
          s = s.replace('private const val FADE_IN_MS = 140L', 'private const val FADE_IN_MS = 0L')
          s = s.replace('private const val FADE_OUT_FLAT_MS = 120L', 'private const val FADE_OUT_FLAT_MS = 80L')

          service.write_text(s)
      - name: Build debug APK
        working-directory: duo-open
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-MagicV2-v3-debug
          path: duo-open/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
