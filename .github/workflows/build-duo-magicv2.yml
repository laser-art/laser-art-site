name: Build DisplayToggle Extreme

on:
  push:
    branches:
      - duo-open-magicv2-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone DisplayToggle Extreme
        run: git clone --depth 1 https://github.com/xe5700/DisplayToggleExtreme.git displaytoggle
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build release APK
        working-directory: displaytoggle
        run: /tmp/gradle-8.7/bin/gradle assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DisplayToggleExtreme
          path: displaytoggle/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
