name: Build Duo Open Magic V2

on:
  push:
    branches:
      - duo-open-magicv2-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone Duo Open
        run: git clone --depth 1 https://github.com/marcoazeem/duo-open.git duo-open
      - name: Apply Magic V2 v3 patch
        run: python tools/patch_magicv2_v3.py
      - name: Build debug APK
        working-directory: duo-open
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-MagicV2-v3-debug
          path: duo-open/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
