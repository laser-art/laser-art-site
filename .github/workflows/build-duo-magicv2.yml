name: Build Magic V2 Advanced Diagnostic

on:
  push:
    branches:
      - duo-open-magicv2-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clone DisplayToggle Extreme
        run: git clone --depth 1 https://github.com/xe5700/DisplayToggleExtreme.git displaytoggle
      - name: Apply Magic V2 angle controller V3 patch
        run: python tools/patch_magicv2_angle_v3.py
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build Magic V2 angle controller V3 APK
        working-directory: displaytoggle
        run: /tmp/gradle-8.7/bin/gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicV2-AngleController-V3
          path: displaytoggle/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
