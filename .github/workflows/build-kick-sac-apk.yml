name: Build Kick Sac APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kick-sac-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p kick-sac-android app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kick-Sac-APK
          path: kick-sac-android/app/build/outputs/apk/debug/app-debug.apk
