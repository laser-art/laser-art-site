name: Build Kick Sac Fighter V6 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kick-sac-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Clean and build V6 APK
        run: |
          gradle -p kick-sac-android clean app:assembleDebug
          cp kick-sac-android/app/build/outputs/apk/debug/app-debug.apk Kick-Sac-Fighter-V6.apk
      - name: Upload V6 APK
        uses: actions/upload-artifact@v4
        with:
          name: Kick-Sac-Fighter-V6
          path: Kick-Sac-Fighter-V6.apk
