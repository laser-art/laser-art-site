plugins { id 'com.android.application' }

android {
    namespace 'be.laserart.kicksac'
    compileSdk 35

    defaultConfig {
        applicationId 'be.laserart.kicksac.v3'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
